[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakout-retest"
version = "0.1.0"
description = "Daily resistance -> 1H breakout -> retest entry: levels, signals, engine, backtest"
requires-python = ">=3.10"
dependencies = []          # stdlib only, on purpose — see README

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["breakout*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-q"
